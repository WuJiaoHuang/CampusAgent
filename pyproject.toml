[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "campus-agent"
version = "0.1.0"
description = "CampusTrain 的独立 Python 智能课程客服 Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "sentence-transformers>=5.2.0",
]

[tool.uv]
cache-dir = ".uv-cache"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real CampusTrain Gateway calls"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
